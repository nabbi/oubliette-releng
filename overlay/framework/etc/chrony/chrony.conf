# Framework 13 Pro: chrony for a laptop that roams and sleeps

# NTS (RFC 8915): authenticated time, one source per operator. Needs outbound
# tcp/4460 (NTS-KE) and udp/123.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ntppool1.time.nl iburst nts
minsources 2

# NTS cookies survive restarts, so a boot or resume skips the key exchange.
# A clock reset to the firmware epoch would fail every certificate's validity
# check: ignore it for the first exchange only (chain and name still checked).
ntsdumpdir /var/lib/chrony
nocerttimecheck 1

driftfile /var/lib/chrony/drift
# Step any offset over 1 s, not only at startup: corrects the clock at once
# after a resume from suspend or hibernate
makestep 1 -1
# Kernel copies system time to the RTC every 11 min
rtcsync

# No UDP command port; chronyc as root uses /run/chrony/chronyd.sock
cmdport 0
