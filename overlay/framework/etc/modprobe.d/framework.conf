# Framework 13 Pro (CrOS EC over LPC)

# cros_charge_control refuses to bind on Framework EC firmware ("Framework
# charge control detected, preventing load") unless told to. With it,
# /sys/class/power_supply/BAT1/charge_control_{start,end}_threshold and
# charge_behaviour work. This is the EC's generic charge control, a second
# limit next to the Framework one framework_tool sets; the lower applies.
# The driver writes 100 when it loads and doesn't read the EC back, so the
# Framework limit (kept in the EC) still holds after a reboot.
options cros_charge_control probe_with_fwk_charge_control=1
